<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wine Cultivar Classifier</title>
  <style>
    body { font-family: -apple-system, Helvetica, Arial, sans-serif; background: #f6f1f3; color: #2b1a22; margin: 0; padding: 32px 16px; }
    .card { max-width: 760px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 28px; box-shadow: 0 6px 24px rgba(80, 20, 40, 0.12); }
    h1 { margin-top: 0; color: #7b1e3a; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
    label { display: block; font-size: 0.8rem; color: #6b5560; margin-bottom: 4px; }
    input { width: 100%; padding: 8px; border: 1px solid #d9c7cf; border-radius: 8px; box-sizing: border-box; }
    button { margin-top: 18px; width: 100%; padding: 12px; background: #7b1e3a; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 20px; display: none; }
    .bar { background: #eee; border-radius: 6px; margin: 6px 0; overflow: hidden; }
    .fill { background: #b3446c; height: 12px; }
    .bar-label { font-size: 0.85rem; margin-top: 10px; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Wine Cultivar Classifier</h1>
    <p>Predicts which of three grape cultivars a wine comes from, using 13 chemical measurements. The fields are pre-filled with a real sample from the test set. Model test accuracy: {{ accuracy }}.</p>
    <form id="form">
      <div class="grid">
        {% for feature in features %}
        <div>
          <label for="{{ feature }}">{{ feature }}</label>
          <input type="number" step="any" min="0" id="{{ feature }}" name="{{ feature }}" value="{{ example[feature] }}" required>
        </div>
        {% endfor %}
      </div>
      <button type="submit">Predict</button>
    </form>
    <div id="result"></div>
  </div>
  <script>
    document.getElementById("form").addEventListener("submit", async function (event) {
      event.preventDefault();
      const payload = {};
      document.querySelectorAll("#form input").forEach(function (input) {
        payload[input.name] = input.value;
      });
      const result = document.getElementById("result");
      result.style.display = "block";
      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        if (!response.ok) {
          result.innerHTML = "<p class='error'>Error: " + data.error + "</p>";
          return;
        }
        let html = "<h2>Prediction: " + data.predicted_class + "</h2>";
        html += "<p>Confidence: " + (data.confidence * 100).toFixed(1) + "%</p>";
        for (const [name, p] of Object.entries(data.probabilities)) {
          const pct = (p * 100).toFixed(1);
          html += "<div class='bar-label'>" + name + ": " + pct + "%</div><div class='bar'><div class='fill' style='width:" + pct + "%'></div></div>";
        }
        result.innerHTML = html;
      } catch (err) {
        result.innerHTML = "<p class='error'>Could not reach the server.</p>";
      }
    });
  </script>
</body>
</html>
